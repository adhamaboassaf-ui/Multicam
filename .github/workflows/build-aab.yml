name: Build Android AAB
​on:
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
​- name: Setup Java
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Build Complete Android Project
run: |
mkdir -p app/src/main/assets/public
mkdir -p app/src/main/java/com/amotion/multicam
​# نسخ ملفات المشروع إذا وجدت أو إنشاء صفحة افتراضية
cp -r *.html *.js *.css *.json *.webmanifest icons img app/src/main/assets/public/ 2>/dev/null || true
if [ ! -f app/src/main/assets/public/index.html ]; then
echo '<!DOCTYPE html><html><body><h1>AMotionMulticam</h1></body></html>' > app/src/main/assets/public/index.html
fi
​# 1. إنشاء مفتاح التوقيع الرقمي (Keystore)
keytool -genkey -v -keystore app/release.keystore -alias amotion_key -keyalg RSA -keysize 2048 -validity 10000 -storepass AMotion2026! -keypass AMotion2026! -dname "CN=AMotionMulticam, OU=Dev, O=AMotion, L=Beirut, S=Beirut, C=LB"
​# 2. إنشاء ملف settings.gradle
cat << 'EOF' > settings.gradle
pluginManagement {
repositories {
google()
mavenCentral()
gradlePluginPortal()
}
}
dependencyResolutionManagement {
repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
repositories {
google()
mavenCentral()
}
}
rootProject.name = "AMotionMulticam"
include ':app'
EOF
​# 3. إنشاء ملف build.gradle الرئيسي
cat << 'EOF' > build.gradle
plugins {
id 'com.android.application' version '8.2.2' apply false
id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF
​# 4. إنشاء ملف gradle.properties
cat << 'EOF' > gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF
​# 5. إنشاء ملف app/build.gradle مع إعدادات التوقيع
cat << 'EOF' > app/build.gradle
plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}
android {
namespace 'com.amotion.multicam'
compileSdk 34
defaultConfig {
applicationId "com.amotion.multicam"
minSdk 22
targetSdk 34
versionCode 1
versionName "1.0"
}
signingConfigs {
release {
storeFile file("release.keystore")
storePassword "AMotion2026!"
keyAlias "amotion_key"
keyPassword "AMotion2026!"
}
}
buildTypes {
release {
signingConfig signingConfigs.release
minifyEnabled false
}
}
compileOptions {
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}
kotlinOptions {
jvmTarget = '17'
}
}
dependencies {
implementation 'androidx.core:core-ktx:1.12.0'
implementation 'androidx.appcompat:appcompat:1.6.1'
}
EOF
​# 6. إنشاء ملف AndroidManifest.xml
cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
<uses-permission android:name="android.permission.INTERNET" />
<uses-permission android:name="android.permission.CAMERA" />
<uses-permission android:name="android.permission.RECORD_AUDIO" />
<application
android:allowBackup="true"
android:label="AMotionMulticam"
android:theme="@style/Theme.AppCompat.Light.NoActionBar">
<activity
android:name=".MainActivity"
android:exported="true">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
</application>
</manifest>
EOF
​# 7. إنشاء كود التطبيق MainActivity.kt
cat << 'EOF' > app/src/main/java/com/amotion/multicam/MainActivity.kt
package com.amotion.multicam
import android.os.Bundle
import android.webkit.WebView
import android.webkit.WebChromeClient
import androidx.appcompat.app.AppCompatActivity
​class MainActivity : AppCompatActivity() {
override fun onCreate(savedInstanceState: Bundle?) {
super.onCreate(savedInstanceState)
val webView = WebView(this)
webView.settings.javaScriptEnabled = true
webView.settings.domStorageEnabled = true
webView.settings.mediaPlaybackRequiresUserGesture = false
webView.webChromeClient = WebChromeClient()
webView.loadUrl("file:///android_asset/public/index.html")
setContentView(webView)
}
}
EOF
​- name: Generate Gradle Wrapper & Build Signed AAB
run: |
gradle wrapper --gradle-version 8.4
chmod +x gradlew
./gradlew bundleRelease
​- name: Upload Signed AAB & Keystore
uses: actions/upload-artifact@v4
with:
name: AMotionMulticam-Signed-Release
path: |
app/build/outputs/bundle/release/*.aab
app/release.keystore
