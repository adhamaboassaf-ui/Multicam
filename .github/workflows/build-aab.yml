name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Native Android Project
        run: |
          mkdir -p app/src/main/assets/public
          mkdir -p app/src/main/java/com/amotion/multicam
          
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/public/
          else
            echo '<!DOCTYPE html><html><body><h1>AMotionMulticam</h1></body></html>' > app/src/main/assets/public/index.html
          fi

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.amotion.multicam'
              compileSdk 34
              defaultConfig {
                  applicationId "com.amotion.multicam"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > settings.gradle
          rootProject.name = "AMotionMulticam"
          include ':app'
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.amotion.multicam">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="AMotionMulticam"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/amotion/multicam/MainActivity.kt
          package com.amotion.multicam
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.loadUrl("file:///android_asset/public/index.html")
                  setContentView(webView)
              }
          }
          EOF

          # إنشاء ملفات الـ Gradle الأساسية للبناء
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          gradle init --type basic --automation-language groovy --project-name AMotionMulticam --dsl groovy --use-defaults --quiet || true

      - name: Build Release AAB
        run: |
          # استخدام gradle مباشر للبناء بدون الحاجة لملفات wrapper معقدة
          gradle bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMotionMulticam-AAB
          path: app/build/outputs/bundle/release/*.aab
