name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Complete Android Project
        run: |
          mkdir -p app/src/main/assets/public
          mkdir -p app/src/main/java/com/amotion/multicam

          # نسخ ملفات المشروع إذا وجدت أو إنشاء صفحة افتراضية
          cp -r *.html *.js *.css *.json *.webmanifest icons img app/src/main/assets/public/ 2>/dev/null || true
          if [ ! -f app/src/main/assets/public/index.html ]; then
            echo '<!DOCTYPE html><html><body><h1>AMotionMulticam</h1></body></html>' > app/src/main/assets/public/index.html
          fi

          # 1. إنشاء مفتاح التوقيع الرقمي (Keystore) داخل مجلد التطبيق
          cd app
          keytool -genkey -v -keystore release.keystore -alias amotion_key -keyalg RSA -keysize 2048 -validity 10000 -storepass AMotion2026! -keypass AMotion2026! -dname "CN=AMotionMulticam, OU=Dev, O=AMotion, L=Beirut, S=Beirut, C=LB"
          cd ..

          # 2. إنشاء ملف settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  
