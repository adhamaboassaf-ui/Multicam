name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Clean Capacitor App & Build
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "AMotionMulticam" "com.amotion.multicam" --web-dir=public
          mkdir -p public
          echo '<!DOCTYPE html><html><head><title>AMotionMulticam</title></head><body><h1>AMotionMulticam App</h1></body></html>' > public/index.html
          npx cap add android
          npx cap sync android

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMotionMulticam-AAB
          path: android/app/build/outputs/bundle/release/*.aab
